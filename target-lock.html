<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Target Lock</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none}
  #wrap{position:relative;width:100%;height:100%}
  video,canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
  #ui{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;
      font:12px monospace;color:#0f0;pointer-events:none;text-shadow:0 0 3px #000}
  #btn{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
       padding:10px 18px;background:#111a;color:#0f0;border:1px solid #0f0;
       font:14px monospace;border-radius:6px;pointer-events:auto}
  #gate{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:14px;z-index:10}
  #gateBtn{padding:14px 24px;background:#0f0;color:#000;border:none;
           font:16px monospace;border-radius:8px}
  #gateMsg{color:#0f0;font:13px monospace;text-align:center;padding:0 20px}
</style>
</head>
<body>
<div id="wrap">
  <video id="v" autoplay playsinline muted></video>
  <canvas id="c"></canvas>
  <div id="ui"><span id="status">tap target to lock</span><span id="fps">0 fps</span></div>
  <button id="btn">switch cam</button>
  <div id="gate">
    <div id="gateMsg">Camera access is required to track a target.</div>
    <button id="gateBtn">Allow Camera Access</button>
  </div>
</div>
<script>
const v = document.getElementById('v'), c = document.getElementById('c'), ctx = c.getContext('2d', {willReadFrequently:true});
const statusEl = document.getElementById('status'), fpsEl = document.getElementById('fps');
let stream, facing = 'environment';
const gate = document.getElementById('gate'), gateBtn = document.getElementById('gateBtn'), gateMsg = document.getElementById('gateMsg');

async function startCam() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing, width:{ideal:640}, height:{ideal:480}}, audio:false});
  v.srcObject = stream;
  await v.play();
  c.width = v.videoWidth; c.height = v.videoHeight;
}

async function requestCamera() {
  gateBtn.disabled = true;
  gateMsg.textContent = 'Requesting camera access...';
  try {
    await startCam();
    gate.style.display = 'none';
  } catch (err) {
    gateBtn.disabled = false;
    gateMsg.textContent = 'Camera access denied or unavailable (' + err.message + '). Tap to try again, and allow camera permission when prompted.';
  }
}

gateBtn.onclick = requestCamera;
document.getElementById('btn').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCam(); };

// --- tap-to-lock template tracker ---
const BOX = 40;         // half-size of tracked patch
const SEARCH = 25;       // search radius per frame (px, scaled to processing res)
const SCALE = 0.5;       // downscale for speed
let lock = null;         // {x,y} in processing-res coords
let template = null;     // Uint8ClampedArray grayscale patch

function toProcCoords(clientX, clientY) {
  const r = c.getBoundingClientRect();
  const px = (clientX - r.left) / r.width * c.width * SCALE;
  const py = (clientY - r.top) / r.height * c.height * SCALE;
  return {x: px, y: py};
}

function grayFrame(w, h) {
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const octx = off.getContext('2d', {willReadFrequently:true});
  octx.drawImage(v, 0, 0, w, h);
  const d = octx.getImageData(0, 0, w, h).data;
  const g = new Uint8ClampedArray(w*h);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) g[j] = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114)|0;
  return g;
}

function extractPatch(g, w, h, cx, cy) {
  const p = new Uint8ClampedArray(BOX*2*BOX*2);
  let k = 0;
  for (let y = cy-BOX; y < cy+BOX; y++)
    for (let x = cx-BOX; x < cx+BOX; x++) {
      p[k++] = (x>=0 && x<w && y>=0 && y<h) ? g[y*w+x] : 0;
    }
  return p;
}

function sad(a, b) {
  let s = 0;
  for (let i = 0; i < a.length; i++) s += Math.abs(a[i]-b[i]);
  return s;
}

c.addEventListener('pointerdown', e => {
  const p = toProcCoords(e.clientX, e.clientY);
  lock = {x: Math.round(p.x), y: Math.round(p.y)};
  statusEl.textContent = 'locking...';
  template = null; // grab template on next frame tick
  pendingLock = true;
});
let pendingLock = false;

let lastT = performance.now(), frames = 0, fpsT = performance.now();

function loop() {
  if (v.readyState >= 2 && c.width) {
    const w = Math.round(c.width*SCALE), h = Math.round(c.height*SCALE);
    const g = grayFrame(w, h);

    if (pendingLock && lock) {
      template = extractPatch(g, w, h, lock.x, lock.y);
      pendingLock = false;
      statusEl.textContent = 'locked';
    } else if (template && lock) {
      let best = null, bestScore = Infinity;
      for (let dy = -SEARCH; dy <= SEARCH; dy += 2) {
        for (let dx = -SEARCH; dx <= SEARCH; dx += 2) {
          const cx = lock.x+dx, cy = lock.y+dy;
          const p = extractPatch(g, w, h, cx, cy);
          const s = sad(p, template);
          if (s < bestScore) { bestScore = s; best = {x:cx,y:cy}; }
        }
      }
      if (best) {
        lock = best;
        // slow template refresh to tolerate slight appearance drift
        const newP = extractPatch(g, w, h, lock.x, lock.y);
        for (let i = 0; i < template.length; i++) template[i] = template[i]*0.85 + newP[i]*0.15;
      }
    }

    ctx.clearRect(0,0,c.width,c.height);
    if (lock && template) {
      const sx = 1/SCALE;
      const rx = lock.x*sx, ry = lock.y*sx, rb = BOX*sx;
      ctx.strokeStyle = '#0f0'; ctx.lineWidth = 3;
      ctx.strokeRect(rx-rb, ry-rb, rb*2, rb*2);
      ctx.beginPath(); ctx.moveTo(rx-10,ry); ctx.lineTo(rx+10,ry);
      ctx.moveTo(rx,ry-10); ctx.lineTo(rx,ry+10); ctx.stroke();
    }
  }
  frames++;
  const now = performance.now();
  if (now - fpsT > 500) { fpsEl.textContent = Math.round(frames*1000/(now-fpsT)) + ' fps'; frames=0; fpsT=now; }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
